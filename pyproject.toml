[project]
name = "codex-stt-bridge"
version = "0.2.0"
description = "Speech-to-text CLI bridge for AI agents using a local Codex login"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "ai-babai" },
]
keywords = [
  "ai-agents",
  "chatgpt",
  "codex",
  "hermes-agent",
  "openclaw",
  "speech-recognition",
  "speech-to-text",
  "voice-to-text",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
codex-stt = "codex_stt_bridge.cli:main"

[project.urls]
Documentation = "https://github.com/ai-babai/codex-stt-bridge#readme"
Issues = "https://github.com/ai-babai/codex-stt-bridge/issues"
Repository = "https://github.com/ai-babai/codex-stt-bridge"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_stt_bridge"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
