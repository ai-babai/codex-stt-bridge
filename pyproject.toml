[project]
name = "hermes-codex-stt"
version = "0.1.0"
description = "Codex OAuth speech-to-text command provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ai-babai" },
]
keywords = ["codex", "hermes-agent", "speech-to-text", "telegram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
codex-stt = "hermes_codex_stt.cli:main"

[project.urls]
Repository = "https://github.com/ai-babai/hermes-codex-stt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_codex_stt"]
