[project]
name = "hermes-codex-stt"
version = "0.1.0"
description = "Codex OAuth speech-to-text command provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "ai-babai" },
]
keywords = ["codex", "hermes-agent", "speech-to-text", "telegram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
codex-stt = "hermes_codex_stt.cli:main"

[project.urls]
Repository = "https://github.com/ai-babai/hermes-codex-stt"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_codex_stt"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
